<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Página Inicial')}"></head>

<body>

<!-- MENU -->
<div th:replace="~{fragments/menu :: body}"></div>

<!-- CARROSSEL -->
<div id="carouselExampleCaptions"
     class="carousel slide carousel-fade"
     data-bs-ride="carousel">

    <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">

        <div class="carousel-item active" data-bs-interval="4000">
            <img th:src="@{/images/banner1.jpg}" class="d-block w-100" style="height:420px; object-fit:cover;">
        </div>

        <div class="carousel-item" data-bs-interval="4000">
            <img th:src="@{/images/banner2.jpg}" class="d-block w-100" style="height:420px; object-fit:cover;">
        </div>

        <div class="carousel-item" data-bs-interval="4000">
            <img th:src="@{/images/banner3.jpg}" class="d-block w-100" style="height:420px; object-fit:cover;">
        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>

<!-- ESTATÍSTICAS -->
<div class="container mt-5">
    <div class="row g-4 text-center">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm py-4">
                <div class="card-body">
                    <i class="bi bi-gift fs-1 text-success"></i>
                    <h2 class="fw-bold mt-2" th:text="${estatisticas.totalDoacoes}">0</h2>
                    <p class="text-muted mb-0">Doações cadastradas</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm py-4">
                <div class="card-body">
                    <i class="bi bi-building fs-1 text-success"></i>
                    <h2 class="fw-bold mt-2" th:text="${estatisticas.totalInstituicoes}">0</h2>
                    <p class="text-muted mb-0">Instituições atendidas</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm py-4">
                <div class="card-body">
                    <i class="bi bi-box-seam fs-1 text-success"></i>
                    <h2 class="fw-bold mt-2" th:text="${estatisticas.totalAlimentos} + ' kg'">0 kg</h2>
                    <p class="text-muted mb-0">Alimentos distribuídos</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- DOAÇÕES -->
<div th:replace="~{fragments/doacoes :: secao-doacoes}"></div>

<!-- RODAPÉ -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- BOOTSTRAP JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
