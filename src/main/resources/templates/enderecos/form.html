<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Endereço')}"></head>

<body>

<div th:replace="~{fragments/menu :: body}"></div>

<div class="container mt-4" style="max-width: 640px;">

    <h2 class="mb-4" th:text="${endereco.id == null ? 'Novo Endereço' : 'Editar Endereço'}"></h2>

    <form th:action="@{/enderecos/salvar}" th:object="${endereco}" method="post">

        <input type="hidden" th:field="*{id}">
        <input type="hidden" name="usuario.id" th:value="${endereco.usuario.id}">

        <div class="mb-3">
            <label class="form-label">Logradouro</label>
            <input type="text" class="form-control" th:field="*{logradouro}" required>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Número</label>
                <input type="text" class="form-control" th:field="*{numero}" required>
            </div>
            <div class="col-md-8 mb-3">
                <label class="form-label">Bairro</label>
                <input type="text" class="form-control" th:field="*{bairro}" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control" th:field="*{cidade}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Estado (UF)</label>
                <input type="text" class="form-control" th:field="*{estado}" maxlength="2" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">CEP</label>
            <input type="text" class="form-control" th:field="*{cep}" maxlength="9" required>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-floppy"></i> Salvar
            </button>
            <a th:href="@{'/enderecos/listar/' + ${endereco.usuario.id}}" class="btn btn-outline-secondary">
                <i class="bi bi-list-ul"></i> Ver Lista de Endereços
            </a>
        </div>

    </form>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
