<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Endereços')}"></head>

<body>

<div th:replace="~{fragments/menu :: body}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Endereços de <span class="text-success" th:text="${usuario.nome}"></span></h2>
        <a th:href="@{'/enderecos/novo/' + ${usuario.id}}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Novo Endereço
        </a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-success">
        <tr>
            <th>Logradouro</th>
            <th>Número</th>
            <th>Bairro</th>
            <th>Cidade</th>
            <th>Estado</th>
            <th>CEP</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${enderecos}">
            <td th:text="${e.logradouro}"></td>
            <td th:text="${e.numero}"></td>
            <td th:text="${e.bairro}"></td>
            <td th:text="${e.cidade}"></td>
            <td th:text="${e.estado}"></td>
            <td th:text="${e.cep}"></td>
            <td>
                <a th:href="@{'/enderecos/editar/' + ${e.id}}" class="btn btn-warning btn-sm">
                    <i class="bi bi-pencil"></i> Editar
                </a>
                <a th:href="@{'/enderecos/deletar/' + ${e.id} + '/' + ${usuario.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Deseja excluir este endereço?')">
                    <i class="bi bi-trash"></i> Excluir
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(enderecos)}">
            <td colspan="7" class="text-center text-muted py-3">Nenhum endereço cadastrado.</td>
        </tr>
        </tbody>
    </table>

    <a href="/usuarios/listar" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Voltar para Usuários
    </a>

</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
