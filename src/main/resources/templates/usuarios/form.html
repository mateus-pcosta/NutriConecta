<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Cadastro de Usuário')}"></head>

<body>

<!-- MENU -->
<div th:replace="~{fragments/menu :: body}"></div>

<h2 class="mb-4" th:text="${usuario.id == null ? 'Novo Usuário' : 'Editar Usuário'}"></h2>

<form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">

    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" th:field="*{nome}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" th:field="*{email}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" class="form-control" th:field="*{senha}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Tipo</label>
        <select class="form-select" th:field="*{tipo}">
            <option value="">Selecione...</option>
            <option value="DOADOR">Doador</option>
            <option value="INSTITUICAO">Instituição</option>
            <option value="ADMIN">Administrador</option>
        </select>
    </div>

    <button class="btn btn-success">Salvar</button>
    <a href="/usuarios/listar" class="btn btn-secondary">Cancelar</a>

</form>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
