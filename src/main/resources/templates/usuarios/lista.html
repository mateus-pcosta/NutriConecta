<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Lista de Usuários')}"></head>

<body>

<div th:replace="~{fragments/menu :: body}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Usuários</h2>
        <a href="/usuarios/novo" class="btn btn-success">
            <i class="bi bi-person-plus"></i> Novo Usuário
        </a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-success">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Tipo</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nome}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.tipo}"></td>
            <td>
                <a th:href="@{'/enderecos/listar/' + ${u.id}}" class="btn btn-info btn-sm">
                    <i class="bi bi-geo-alt"></i> Endereços
                </a>
                <a th:href="@{'/usuarios/editar/' + ${u.id}}" class="btn btn-warning btn-sm">
                    <i class="bi bi-pencil"></i> Editar
                </a>
                <a th:href="@{'/usuarios/deletar/' + ${u.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Deseja excluir este usuário?')">
                    <i class="bi bi-trash"></i> Excluir
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
