<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Lista de Usuários')}"></head>

<body>

<!-- MENU -->
<div th:replace="~{fragments/menu :: body}"></div>

<h2 class="mb-4">Lista de Usuários</h2>

<a href="/usuarios/novo" class="btn btn-primary mb-3">Novo Usuário</a>

<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th><th>Nome</th><th>Email</th><th>Tipo</th><th>Ações</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="u : ${usuarios}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.nome}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.tipo}"></td>

        <td>
            <a th:href="@{'/usuarios/editar/' + ${u.id}}" class="btn btn-warning btn-sm">Editar</a>
            <a th:href="@{'/usuarios/deletar/' + ${u.id}}" class="btn btn-danger btn-sm">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
